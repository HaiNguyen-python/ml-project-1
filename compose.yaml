#compose.yaml - describes how to run the project's services 

services: 
  api:
    build: .        #build the image from the Dockerfile in this folder
    image: iris-api #name of the image
    ports: 
      - "8000:8000" #laptop port: container port 
    restart: unless-stopped #restart automatically if it crashes 
    healthcheck:    #Docker checks /health every 30s 
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3